# Nginx configuration for https://www.restainup.it (main address, with www)
# (Nginx 1.24, Ubuntu). Copy to /etc/nginx/sites-available/, link it in
# sites-enabled/, then: sudo nginx -t && sudo systemctl reload nginx
#
# The site is a single-page app: every address that is not a real file is
# served by index.html. Nginx ignores the .htaccess in the build.
#
# Certificate for both names:
#   sudo certbot certonly --nginx -d restainup.it -d www.restainup.it
# Replace the paths below if they differ.

# http -> https (both names)
server {
    listen 80;
    listen [::]:80;
    server_name restainup.it www.restainup.it;
    return 301 https://www.restainup.it$request_uri;
}

# https without www -> https with www (canonical, sitemap and links use www)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name restainup.it;

    ssl_certificate     /etc/letsencrypt/live/restainup.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restainup.it/privkey.pem;

    return 301 https://www.restainup.it$request_uri;
}

# The site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.restainup.it;

    ssl_certificate     /etc/letsencrypt/live/restainup.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restainup.it/privkey.pem;

    # Folder where the content of dist/ is uploaded (adjust to the real path).
    root /var/www/frontend/restainup;
    index index.html;
    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml text/plain;

    # Never serve hidden files (e.g. the Apache .htaccess included in the build).
    location ~ /\. {
        deny all;
    }

    # Drop trailing slashes: /remote-dental/ -> /remote-dental (the canonical form,
    # also for old addresses indexed by Google with the slash).
    rewrite ^/(.+)/$ /$1 permanent;

    # Files as they are; every other address is a route of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built JS/CSS/images/videos have a content hash in their name: cache them for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # index.html must always be fresh after a new upload.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
