<!DOCTYPE html>
<html lang="it">
  <head>

    <script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="df94eeef-6b21-4e6e-945a-e90ad4c9ceb0" data-blockingmode="auto" type="text/javascript"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />

    <!--
      Title/description/OG qui sotto sono il fallback statico (prima del mount React
      e per i crawler che non eseguono JS, es. i bot di preview social). Sono già
      allineati alla homepage: src/app/components/layout/Seo.tsx li riscrive per
      ogni route una volta montata l'app, leggendo da src/app/data/seo.ts.
    -->
    <title>Restainup — Sviluppo Web, App e Trasformazione Digitale</title>
    <meta
      name="description"
      content="Restainup progetta siti, app, e-commerce e strumenti su misura per guidare la trasformazione digitale della tua azienda. Scopri i nostri servizi."
    />
    <!-- Default: staging GitHub Pages (noindex). La build per Aruba (build-aruba.sh)
         imposta VITE_ROBOTS=index, follow per la versione pubblica indicizzabile. -->
    <meta name="robots" content="%VITE_ROBOTS%" />

    <link rel="canonical" href="%VITE_SITE_ORIGIN%%BASE_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Restainup" />
    <meta property="og:title" content="Restainup — Sviluppo Web, App e Trasformazione Digitale" />
    <meta
      property="og:description"
      content="Restainup progetta siti, app, e-commerce e strumenti su misura per guidare la trasformazione digitale della tua azienda. Scopri i nostri servizi."
    />
    <meta property="og:url" content="%VITE_SITE_ORIGIN%%BASE_URL%" />
    <meta property="og:image" content="%VITE_SITE_ORIGIN%%BASE_URL%og-image.jpg" />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Restainup — Sviluppo Web, App e Trasformazione Digitale" />
    <meta
      name="twitter:description"
      content="Restainup progetta siti, app, e-commerce e strumenti su misura per guidare la trasformazione digitale della tua azienda. Scopri i nostri servizi."
    />
    <meta name="twitter:image" content="%VITE_SITE_ORIGIN%%BASE_URL%og-image.jpg" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Restainup",
        "legalName": "Resta in UP Srl",
        "url": "%VITE_SITE_ORIGIN%%BASE_URL%",
        "email": "info@restainup.it",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Milano",
          "addressCountry": "IT"
        },
        "parentOrganization": {
          "@type": "Organization",
          "name": "Gruppo APM",
          "url": "https://www.gruppoapm.com/"
        },
        "description": "Restainup progetta siti, app, e-commerce e strumenti su misura per guidare la trasformazione digitale delle aziende."
      }
    </script>

    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>

  </head>

  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
